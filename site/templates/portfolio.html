<main id="main">

<section class="wrap section section--tight">
<div class="eyebrow">{{portfolio.hero.eyebrow}}</div>
<h1 class="display display--h1">{{portfolio.hero.title}}</h1>
<p class="lead">{{portfolio.hero.copy}}</p>
<div class="filters" role="group" aria-label="{{a11y.filter.group}}">
{{{portfolio.filters}}}
<span class="filter-count" id="worksCount" data-count-template="{{portfolio.count}}">{{portfolio.countInitial}}</span>
</div>
</section>

<section class="section section--tight">
<div class="wrap">
<div class="work-grid work-grid--index" id="worksGrid">{{{portfolio.cards}}}</div>
<p class="works-empty" id="worksEmpty" hidden>{{portfolio.empty}}</p>
</div>
</section>

<section class="section section--tight">
<div class="wrap">
<div class="band">
<div>
<h2 class="display">{{portfolio.cta.title}}</h2>
<p>{{portfolio.cta.copy}}</p>
</div>
<div class="actions"><a class="btn btn--solid" href="{{page.bookUrl}}">{{nav.book}}</a></div>
</div>
</div>
</section>

</main>
