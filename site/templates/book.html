<main id="main">

<section class="wrap section section--tight">
<div class="eyebrow">{{book.hero.eyebrow}}</div>
<h1 class="display display--h1">{{book.hero.title}}</h1>
<p class="lead">{{book.hero.copy}}</p>
</section>

<section class="section section--tight">
<div class="wrap book-layout">

<div>
<div class="wa-preview">
<div class="wa-preview__title">{{book.preview.title}}</div>
<p class="wa-preview__body" id="waPreview"></p>
<p class="wa-preview__note">{{book.preview.note}}</p>
</div>
<div class="section-more"><a class="arrow-link" href="https://wa.me/{{site.whatsapp}}" target="_blank" rel="noopener noreferrer">{{book.preview.direct}} →</a></div>
</div>

<form class="book-form" id="bookForm"
      data-wa-number="{{site.whatsapp}}"
      data-wa-template="{{book.waTemplate}}"
      data-wa-name="{{book.waPlaceholderName}}"
      data-wa-date="{{book.waPlaceholderDate}}"
      data-wa-location="{{book.waPlaceholderLocation}}"
      data-wa-notes="{{book.waNotes}}"
      data-date-locale="{{book.dateLocale}}"
      data-month-names="{{book.cal.months}}"
      data-weekday-names="{{book.cal.weekdays}}">

<h2 class="display display--h3">{{book.form.title}}</h2>

<div class="field">
<label class="field__label" for="bookType">{{book.form.type.label}}</label>
<select id="bookType" name="type">{{{book.options}}}</select>
</div>

<div class="field">
<label class="field__label" for="bookName">{{book.form.name.label}}</label>
<input id="bookName" name="name" type="text" placeholder="{{book.form.name.placeholder}}" autocomplete="name">
</div>

<fieldset class="field">
<legend>{{book.form.date.label}}</legend>
<div class="quick-dates">{{{book.quickDates}}}</div>
<div class="cal" id="cal">
<div class="cal__head">
<span id="calTitle"></span>
<span class="cal__nav">
<button type="button" id="calPrev" aria-label="{{book.cal.prev}}">←</button>
<button type="button" id="calNext" aria-label="{{book.cal.next}}">→</button>
</span>
</div>
<div class="cal__week" id="calWeek" aria-hidden="true"></div>
<div class="cal__grid" id="calGrid"></div>
</div>
<input type="hidden" id="bookDate" name="date" value="">
<span class="field__hint" id="calHint">{{book.form.date.hint}}</span>
</fieldset>

<div class="field">
<label class="field__label" for="bookLocation">{{book.form.location.label}}</label>
<input id="bookLocation" name="location" type="text" placeholder="{{book.form.location.placeholder}}">
</div>

<div class="field">
<label class="field__label" for="bookNotes">{{book.form.notes.label}} <span class="field__optional">{{book.form.optional}}</span></label>
<textarea id="bookNotes" name="notes" rows="4" placeholder="{{book.form.notes.placeholder}}"></textarea>
</div>

<p class="form-error" id="bookError" role="alert" hidden>{{book.form.error}}</p>

<button class="btn btn--solid" type="submit">{{book.form.submit}} ↗</button>
<a id="waLink" href="https://wa.me/{{site.whatsapp}}" target="_blank" rel="noopener noreferrer" hidden>{{book.form.submit}}</a>
</form>

</div>
</section>

</main>
