<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Halaman tidak ada — MellogangVisuals</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#EDE7DA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1A1815" media="(prefers-color-scheme: dark)">
<link rel="icon" href="/assets/brand/mellogang-logo.png">
<link rel="stylesheet" href="/tokens.css">
<link rel="stylesheet" href="/styles.css">
<script>try{var t=localStorage.getItem('mellogang-theme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<script>
// Satu halaman 404 melayani kedua bahasa. Vercel menyajikan file ini untuk setiap
// path tak dikenal, termasuk di bawah /en/, jadi bahasanya dipilih dari pathname
// sebelum paint.
(function(){try{var en=location.pathname.indexOf('/en/')===0||location.pathname==='/en';
document.documentElement.lang=en?'en':'id';
document.addEventListener('DOMContentLoaded',function(){
var b=document.querySelectorAll('[data-nf-lang]');
for(var i=0;i<b.length;i++){
if(b[i].getAttribute('data-nf-lang')===(en?'en':'id'))b[i].removeAttribute('hidden');
else b[i].setAttribute('hidden','');}});}catch(e){}})();
</script>
</head>
<body>
<main id="main" class="wrap notfound"><div class="nf-block" data-nf-lang="id"><div class="eyebrow">404</div>
<h1 class="display display--h1">Halaman ini tidak ada</h1>
<p class="lead">Coba buka portofolio, atau kembali ke beranda.</p>
<div class="actions">
<a class="btn btn--solid" href="/portfolio/">Buka portofolio</a>
<a class="btn btn--outline" href="/">Ke beranda</a>
</div>
</div><div class="nf-block" data-nf-lang="en" hidden><div class="eyebrow">404</div>
<h1 class="display display--h1">This page does not exist</h1>
<p class="lead">Try the portfolio, or go back to the home page.</p>
<div class="actions">
<a class="btn btn--solid" href="/en/portfolio/">Open the portfolio</a>
<a class="btn btn--outline" href="/en/">Go to the home page</a>
</div>
</div></main>
<footer class="site-footer">
<div class="wrap footer-bottom"><span>© 2026 MellogangVisuals</span><span>Denpasar, Bali</span></div>
</footer>
</body>
</html>
